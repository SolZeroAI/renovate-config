name: Renovate

# Each SolZero repository calls this workflow with `secrets: inherit`.
# The github context is the caller's, so Renovate runs on the caller.
on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label for the Renovate job"
        type: string
        default: blacksmith-4vcpu-ubuntu-2404

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    if: github.repository_owner == 'SolZeroAI'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Nub
        uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.9.6
          node-version-file: .nvmrc

      # Renovate runs as the solzero-bot App. An App token, unlike
      # GITHUB_TOKEN, starts pull_request workflows on the PRs it opens,
      # and its auto-merges start push workflows on the default branch.
      - name: Create solzero-bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
          permission-checks: read
          permission-statuses: read
          permission-vulnerability-alerts: read

      # Renovate has no nub manager. It edits package.json, then the
      # preset's postUpgradeTasks update nub.lock for that change only.
      - name: Run Renovate
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_ALLOWED_COMMANDS: '["^nub install --prefer-frozen-lockfile --lockfile-only --ignore-scripts$"]'
          LOG_LEVEL: info
        run: npx --yes renovate@44.188.2
